<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Fietscomputer Live</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #000;
    color: #fff;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
}

#error-message {
    color: #ff3b30;
    font-weight: bold;
    text-align: center;
    margin-bottom: 10px;
    min-height: 20px;
    font-size: 14px;
}

#speed-container {
    margin-top: 20px;
    text-align: center;
}

#speed {
    font-size: 110px;
    font-weight: 800;
    line-height: 1;
    color: #34c759;
}

.unit {
    font-size: 20px;
    color: #8e8e93;
    text-transform: uppercase;
    letter-spacing: 2px;
}

#stats-container {
    display: flex;
    width: 100%;
    max-width: 400px;
    margin: 30px 0;
    background: #1c1c1e;
    border-radius: 12px;
    padding: 15px 0;
}

.stat-box {
    flex: 1;
    text-align: center;
    border-right: 1px solid #2c2c2e;
}

.stat-box:last-child {
    border-right: none;
}

.stat-value {
    font-size: 26px;
    font-weight: 600;
}

.controls {
    display: flex;
    gap: 15px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 20px;
}

button {
    flex: 1;
    border: none;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
}

#btn-start {
    background: #34c759;
    color: white;
}

#btn-start.paused {
    background: #ffcc00;
    color: black;
}

#btn-stop {
    background: #ff3b30;
    color: white;
}

#history-container {
    width: 100%;
    max-width: 400px;
    background: #1c1c1e;
    border-radius: 12px;
    padding: 15px;
    box-sizing: border-box;
    margin-bottom: 20px;
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #2c2c2e;
    padding-bottom: 10px;
}

.history-list {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 250px;
    overflow-y: auto;
}

.history-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #2c2c2e;
    font-size: 14px;
}

.history-item:last-child {
    border-bottom: none;
}

#btn-clear-history {
    background: none;
    color: #ff3b30;
    border: none;
    padding: 0;
    font-size: 14px;
}

.backup-controls {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 400px;
}

.btn-backup {
    background: #2c2c2e;
    color: #0a84ff;
    font-size: 14px;
    padding: 10px;
}

#file-input {
    display: none;
}
</style>
</head>

<body>

<div id="error-message">Wachten op GPS-signaal...</div>

<div id="speed-container">
    <div id="speed">0.0</div>
    <div class="unit">km/u</div>
</div>

<div id="stats-container">
    <div class="stat-box">
        <div id="distance" class="stat-value">0.00</div>
        <div class="unit" style="font-size:11px;">Afstand (km)</div>
    </div>

    <div class="stat-box">
        <div id="duration" class="stat-value">00:00</div>
        <div class="unit" style="font-size:11px;">Tijd</div>
    </div>
</div>

<div class="controls">
    <button id="btn-start">START</button>
    <button id="btn-stop" disabled style="opacity:.5;">STOP</button>
</div>

<div id="history-container">
    <div class="history-header">
        <h3 style="margin:0;">Ritgeschiedenis</h3>
        <button id="btn-clear-history">Wis alles</button>
    </div>

    <ul id="history-list" class="history-list"></ul>
</div>

<div class="backup-controls">
    <button id="btn-export" class="btn-backup">📥 Exporteer</button>
    <button id="btn-import-trigger" class="btn-backup">📤 Importeer</button>
    <input type="file" id="file-input" accept=".json">
</div>

<script>
const speedElement = document.getElementById("speed");
const distanceElement = document.getElementById("distance");
const durationElement = document.getElementById("duration");
const errorElement = document.getElementById("error-message");

const btnStart = document.getElementById("btn-start");
const btnStop = document.getElementById("btn-stop");

const historyList = document.getElementById("history-list");
const btnClearHistory = document.getElementById("btn-clear-history");

const btnExport = document.getElementById("btn-export");
const btnImportTrigger = document.getElementById("btn-import-trigger");
const fileInput = document.getElementById("file-input");

let totalDistance = 0;
let elapsedSeconds = 0;
let isTracking = false;
let lastPosition = null;
let timerInterval = null;
let wakeLock = null;

// Correcte Haversine-formule voor afstandsberekening (in kilometers)
function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; // Straal van de aarde in km
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

function formatTime(seconds) {
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;

    if (hrs > 0) {
        return `${String(hrs).padStart(2, "0")}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }
    return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
}

// Voorkom dat het scherm uitgaat tijdens het fietsen
async function requestWakeLock() {
    try {
        if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
        }
    } catch (err) {
        console.warn("Wake Lock niet ondersteund of mislukt:", err);
    }
}

function releaseWakeLock() {
    if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; });
    }
}

function updatePosition(position) {
    errorElement.innerText = "";

    const speedMS = (position.coords.speed !== null && position.coords.speed >= 0) ? position.coords.speed : 0;
    const speedKMH = speedMS * 3.6;

    speedElement.innerText = speedKMH.toFixed(1);

    if (!isTracking) return;

    // Negeer hele onnauwkeurige GPS-metingen (> 30 meter)
    if (position.coords.accuracy > 30) return;

    if (lastPosition) {
        const distance = calculateDistance(
            lastPosition.coords.latitude,
            lastPosition.coords.longitude,
            position.coords.latitude,
            position.coords.longitude
        );

        // Filter hele kleine GPS-schommelingen bij stilstand eruit (~1 km/u drempel)
        if (speedMS > 0.3) {
            totalDistance += distance;
            distanceElement.innerText = totalDistance.toFixed(2);
        }
    }

    lastPosition = position;
}

function handleError(error) {
    switch (error.code) {
        case error.PERMISSION_DENIED:
            errorElement.innerText = "GPS-toegang geweigerd";
            break;
        case error.POSITION_UNAVAILABLE:
            errorElement.innerText = "GPS-signaal niet beschikbaar";
            break;
        case error.TIMEOUT:
            errorElement.innerText = "GPS-timeout";
            break;
        default:
            errorElement.innerText = "GPS-fout";
    }
}

btnStart.addEventListener("click", () => {
    if (!isTracking) {
        isTracking = true;

        btnStart.innerText = "PAUZE";
        btnStart.classList.add("paused");

        btnStop.disabled = false;
        btnStop.style.opacity = "1";

        requestWakeLock();

        timerInterval = setInterval(() => {
            elapsedSeconds++;
            durationElement.innerText = formatTime(elapsedSeconds);
        }, 1000);

    } else {
        isTracking = false;
        clearInterval(timerInterval);
        releaseWakeLock();

        btnStart.innerText = "HERSTART";
        btnStart.classList.remove("paused");

        lastPosition = null;
        speedElement.innerText = "0.0";
    }
});

btnStop.addEventListener("click", () => {
    isTracking = false;
    clearInterval(timerInterval);
    releaseWakeLock();

    if (totalDistance > 0 || elapsedSeconds > 0) {
        saveRide(
            totalDistance.toFixed(2),
            formatTime(elapsedSeconds)
        );
    }

    totalDistance = 0;
    elapsedSeconds = 0;
    lastPosition = null;

    speedElement.innerText = "0.0";
    distanceElement.innerText = "0.00";
    durationElement.innerText = "00:00";

    btnStart.innerText = "START";
    btnStart.classList.remove("paused");

    btnStop.disabled = true;
    btnStop.style.opacity = ".5";
});

function saveRide(distance, time) {
    const date = new Date().toLocaleDateString("nl-NL");

    const ride = { date, distance, time };

    let rides = JSON.parse(localStorage.getItem("rides")) || [];
    rides.unshift(ride);

    localStorage.setItem("rides", JSON.stringify(rides));
    renderHistory();
}

function renderHistory() {
    historyList.innerHTML = "";

    const rides = JSON.parse(localStorage.getItem("rides")) || [];

    if (rides.length === 0) {
        historyList.innerHTML = `<li class="history-item" style="color:#8e8e93;">Nog geen ritten opgeslagen</li>`;
        return;
    }

    rides.forEach(ride => {
        const li = document.createElement("li");
        li.className = "history-item";
        li.innerHTML = `<span>📅 ${ride.date}</span><span>🏁 ${ride.distance} km</span><span>⏱️ ${ride.time}</span>`;
        historyList.appendChild(li);
    });
}

btnClearHistory.addEventListener("click", () => {
    if (confirm("Alle ritten verwijderen?")) {
        localStorage.removeItem("rides");
        renderHistory();
    }
});

btnExport.addEventListener("click", () => {
    const rides = localStorage.getItem("rides") || "[]";
    const blob = new Blob([rides], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = `fietscomputer_backup_${new Date().toISOString().slice(0, 10)}.json`;

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    URL.revokeObjectURL(url);
});

btnImportTrigger.addEventListener("click", () => {
    fileInput.click();
});

fileInput.addEventListener("change", (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);

            if (Array.isArray(imported)) {
                localStorage.setItem("rides", JSON.stringify(imported));
                renderHistory();
                alert("Backup geïmporteerd");
            } else {
                alert("Ongeldig bestand");
            }
        } catch {
            alert("Fout bij lezen bestand");
        }
        event.target.value = ""; // Reset de invoer
    };

    reader.readAsText(file);
});

if ("geolocation" in navigator) {
    navigator.geolocation.watchPosition(
        updatePosition,
        handleError,
        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }
    );
} else {
    errorElement.innerText = "GPS niet ondersteund";
}

renderHistory();
</script>

</body>
</html>
</body>
</html>
