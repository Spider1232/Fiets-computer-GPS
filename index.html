<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fietscomputer</title>
    <!-- Zorgt ervoor dat de app fullscreen opent vanaf het beginscherm -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        #speed-container {
            flex: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #speed {
            font-size: 120px;
            font-weight: 800;
            line-height: 1;
            color: #34c759; /* Apple Groen */
        }

        .unit {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8e8e93;
            margin-top: 10px;
        }

        #stats-container {
            flex: 1;
            display: flex;
            width: 100%;
            border-top: 1px solid #1c1c1e;
            background-color: #1c1c1e;
        }

        .stat-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #2c2c2e;
        }

        .stat-box:last-child {
            border-right: none;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
        }

        #error-message {
            position: absolute;
            top: 20px;
            color: #ff3b30;
            font-weight: bold;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div id="error-message"></div>

    <div id="speed-container">
        <div id="speed">0.0</div>
        <div class="unit">km/u</div>
    </div>

    <div id="stats-container">
        <div class="stat-box">
            <div id="distance" class="stat-value">0.00</div>
            <div class="unit" style="font-size: 12px;">Afstand (km)</div>
        </div>
        <div class="stat-box">
            <div id="accuracy" class="stat-value">--</div>
            <div class="unit" style="font-size: 12px;">GPS Nauwkeurigheid (m)</div>
        </div>
    </div>

    <script>
        const speedElement = document.getElementById('speed');
        const distanceElement = document.getElementById('distance');
        const accuracyElement = document.getElementById('accuracy');
        const errorElement = document.getElementById('error-message');

        let totalDistance = 0; // in kilometers
        let lastPosition = null;

        // Bereken afstand tussen twee GPS-coördinaten (Haversine formule)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Straal van de aarde in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function updatePosition(position) {
            errorElement.innerText = ""; // Wis eventuele fouten
            
            // 1. Snelheid verwerken (m/s naar km/u)
            let speedMS = position.coords.speed;
            if (speedMS !== null && speedMS > 0) {
                let speedKMH = speedMS * 3.6;
                speedElement.innerText = speedKMH.toFixed(1);
            } else {
                speedElement.innerText = "0.0";
            }

            // 2. GPS Nauwkeurigheid tonen
            let accuracy = position.coords.accuracy;
            accuracyElement.innerText = Math.round(accuracy);

            // 3. Afstand berekenen (alleen als de GPS nauwkeurig genoeg is, bijv. binnen 20 meter)
            if (accuracy < 20) {
                if (lastPosition !== null) {
                    let dist = calculateDistance(
                        lastPosition.coords.latitude, 
                        lastPosition.coords.longitude,
                        position.coords.latitude, 
                        position.coords.longitude
                    );
                    
                    // Filter stilstaande ruis eruit (bijv. als je stilstaat maar GPS verspringt)
                    if (speedMS > 0.5) { 
                        totalDistance += dist;
                        distanceElement.innerText = totalDistance.toFixed(2);
                    }
                }
                lastPosition = position;
            }
        }

        function handleError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    errorElement.innerText = "Geef toegang tot je locatie in de instellingen.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    errorElement.innerText = "Locatiegegevens niet beschikbaar.";
                    break;
                case error.TIMEOUT:
                    errorElement.innerText = "GPS verbinding verbroken.";
                    break;
            }
        }

        // Start het live tracken van de GPS
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(updatePosition, handleError, {
                enableHighAccuracy: true, // Forceert het gebruik van de GPS-chip
                timeout: 5000,
                maximumAge: 0
            });
        } else {
            errorElement.innerText = "Jouw browser ondersteunt geen GPS.";
        }
    </script>
</body>
</html>
